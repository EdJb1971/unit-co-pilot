task generateKeystore {
    doLast {
        def keystoreFile = file('release.keystore')
        if (!keystoreFile.exists()) {
            println "Generating keystore..."
            ant.genkey(alias: "key0", storepass: "password", keypass: "password", keystore: keystoreFile, validity: 10000) {
                dname(cn: "Unit Co-Pilot", ou: "App", o: "Unit Co-Pilot", c: "US")
            }
            println "Keystore generated at ${keystoreFile.absolutePath}"
        } else {
            println "Keystore already exists."
        }
    }
}
